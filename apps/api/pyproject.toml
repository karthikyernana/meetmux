[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "planguard-api"
version = "0.1.0"
description = "PlanGuard — PostgreSQL Workload Analyzer & Index Experimentation API"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Data validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary,pool]>=3.2.0",
    # Queue
    "rq>=1.16.0",
    "redis>=5.0.0",
    # PostgreSQL analysis
    "pglast>=6.0",
    # Security
    "cryptography>=43.0.0",
    # AI (optional)
    "google-genai>=2.3.0",
    # Observability
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgresql]>=4.7",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
